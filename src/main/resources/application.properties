spring.application.name=PaymentSystemProject
# MySQL (env vars can override defaults)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:paymentdb}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA defaults
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
# JWT (override the secret via env var in production)
jwt.secret=${JWT_SECRET:dev-local-secret-key-please-change-this-to-a-32byte-or-longer-value}
jwt.expiration-millis=${JWT_EXPIRE_TIME:3600000}
encoder.strength=${BCRYPT_STRENGTH:10}
# portOne
portone.base-url=https://api.portone.io
portone.api-secret=${PORTONE_API_SECRET}
portone.store-id=${PORTONE_STORE_ID}
portone.channel-key=${PORTONE_CHANNEL_KEY}
portone.webhook-secret=${PORTONE_WEBHOOK_SECRET}
# actuator health, info
management.endpoints.web.exposure.include=info,health
# active profiles
spring.profiles.active=local
# logging
logging.level.root=INFO
