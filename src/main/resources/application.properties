spring.application.name=PaymentSystemProject
# MySQL (env vars can override defaults)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:paymentdb}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA defaults for local development
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.sql.init.mode=${SQL_INIT:always}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
server.servlet.context-path=/api/v1

