# GitHub Actions 화면에 표시될 워크플로우 이름
name: CI/CD Pipeline

# 워크플로우 실행 조건
# branches: 설정한 브랜치에 pudh가 발생하면 실행한다.
# paths-ignore: README.md 만 변경된 경우에는 실행하지 않는다.
# workflow_dispatch: GitHub Actions 화면에서 수동 실행할 수 있게 해주는 옵션이다.
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - README.md
  workflow_dispatch:

# 워크플로우 전체에서 사용할 공통 환경변수이다.
# AWS_REGION: AWS 지역
# ECR_REPOSITORY: Docker 이미지를 저장할 ECR 저장소 이름
# CONTAINER_NAME: EC2에서 실행될 Docker 컨테이너 이름
# APP_PORT: EC2에서 열어둘 애플리케이션 포트
env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: payment-system
  CONTAINER_NAME: payment-system
  APP_PORT: 8080

# build Job

jobs:
  # Ubuntu 환경에서 프로젝트를 빌드하고 테스트한다.
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # GitHub 저장소의 코드를 Actions 실행 환경으로 내려받는다.
      - name: Checkout code
        uses: actions/checkout@v4

      # Java 17을 설치한다.
      # AWS 환경과 맞추기 위해 Amazon Corretto 배포판을 사용한다.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      # Linux 환경에서 gradlew를 실행할 수 있도록 권한을 부여한다.
      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      # Gradle로 프로젝트를 빌드 및 테스트한다.
      # 테스트가 실패하면 이 단계에서 job이 실패하고, 이후 작업은 실행되지 않는다.
      # prod 환경 설정을 사용한다. (SPRING_PROFILES_ACTIVE)
      - name: Build and test with Gradle
        env:
          SPRING_PROFILES_ACTIVE: prod
        run: ./gradlew clean build

      # 빌드 결과물인 .jar 파일을 업로드한다.
      # if-no-files-found: error로 jar 파일이 없으면 명확하게 실패 처리한다.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-file
          path: build/libs/*.jar
          if-no-files-found: error

  docker:
    # Docker 이미지를 만들고 ECR에 push한다.
    # needs: build -> build job이 성공해야만 실행한다.
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Dockerfile을 포함한 프로젝트 파일을 다시 체크아웃한다.
      - name: Checkout code
        uses: actions/checkout@v4

      # 앞의 build job에서 업로드한 jar 파일을 다운로드한다.
      # path: build/libs/*.jar를 복사하므로 같은 위치에 내려받는다.
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: jar-file
          path: build/libs

      # AWS CLI와 AWS 관련 Actions가 사용할 인증 정보를 설정한다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Amazon ECR에 Docker login을 수행한다.
      # id: login-ecr를 지정하여 이후 단계에서 ECR registry 주소를 가져올 수 있다.
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Docker 이미지를 빌드하고 ECR에 업로드한다.
      # 이 때 ECR_REGISTRY는 ECR 주소이다.
      # IMAGE_TAG는 현재 커밋 SHA를 의미하며,
      # 배포 추적을 위해 latest와 커밋 SHA 태그를 함께 붙인다.
      # 이후 Docker 이미지를 빌드하고 동일한 이미지에 태그를 두 개 붙인다.
      # 두 태그 모두 ECR에 push한다.
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # EC2에 배포한다.
  # needs: docker -> Docker 이미지 빌드와 push가 성공해야 실행된다.
  # GitHub Environments의 production 환경을 사용한다.
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker
    environment: production

    steps:
      # AWS CLI를 사용해야 하므로 AWS 인증 정보를 다시 설정한다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # EC2에 직접 SSH 접속하지 않고 AWS Systems Manager SSM으로 명령을 실행한다.
      # SSM을 통해 EC2 인스턴스에 shell script를 전달한다.
      # 1. EC2에서 쉘 명령어를 실행한다.
      # 2. 배포 대상 EC2를 태그로 찾는다.
      # 3. EC2에서 ECR에 로그인하여 최신 이미지를 가져온다.
      # 4. 기존 컨테이너가 있다면 중지하고 삭제한다.
      # 5. 새 컨테이너를 실행한다.
      # 6. 컨테이너 실행 후 20초 기다렸다가 Health 엔드포인트를 호출한다.
      # 7. SSM 명령 전송이 완료되었다는 것을 Actions 로그에 남긴다.
      - name: Deploy Spring Boot app via SSM
        run: |
          aws ssm send-command \
            --region ${{ env.AWS_REGION }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy payment-system-project to EC2" \
            --targets "Key=tag:Role,Values=${{ secrets.EC2_SSM_TARGET_ROLE }}" \
            --parameters commands='[
              "set -e",
              "echo Logging in to Amazon ECR...",
              "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com",
          
              "echo Pulling latest image...",
              "docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}",
          
              "echo Stopping old container...",
              "docker stop ${{ env.CONTAINER_NAME }} || true",
              "docker rm ${{ env.CONTAINER_NAME }} || true",
          
              "echo Starting new container...",
              "docker run -d --name ${{ env.CONTAINER_NAME }} --restart unless-stopped -p ${{ env.APP_PORT }}:8080 -e SPRING_PROFILES_ACTIVE=prod -e DB_HOST=${{ secrets.RDS_ENDPOINT }} -e DB_PORT=${{ secrets.RDS_PORT }} -e DB_NAME=${{ secrets.RDS_DATABASE }} -e DB_USER=${{ secrets.RDS_USERNAME }} -e DB_PASSWORD=${{ secrets.RDS_PASSWORD }} -e JWT_SECRET=${{ secrets.JWT_SECRET }} -e DDL_AUTO=${{ secrets.DDL_AUTO }} -e SQL_INIT=never ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}",
          
              "echo Health check...",
              "sleep 20",
              "curl -f http://localhost:${{ env.APP_PORT }}/actuator/health || (docker logs ${{ env.CONTAINER_NAME }} && exit 1)"
            ]'

      - name: Deployment triggered
        run: echo "SSM deployment command sent to EC2 instances."